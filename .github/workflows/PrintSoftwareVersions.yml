name: Print Software Versions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  PrintLanguageVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Print Java Version
        run: java -version

  PrintDBMSVersions:
    runs-on: ubuntu-latest
    needs: [PrintLanguageVersions]
    steps:
      - name: Install MongoDB Docker Image
        run: docker pull mongo:7

      - name: Print MongoDB Version
        run: docker run --rm mongo:7 mongod --version
