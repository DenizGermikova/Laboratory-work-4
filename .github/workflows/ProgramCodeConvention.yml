name: Program Code Convention

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ProgramCodeLinter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:

     - name: Checkout Repository
     uses: actions/checkout@v4
     with:
       fetch-depth: 0


      - name: Start Java Linter
        uses: super-linter/super-linter@v8
        env:
          VALIDATE_JAVA: true
          VALIDATE_ALL_CODEBASE: true
          FILTER_REGEX_INCLUDE: '.*ProgramCode\.java$'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
